services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "55432:5432"
    volumes:
      - opspilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opspilot
      MINIO_ROOT_PASSWORD: opspilot-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - opspilot_minio:/data

volumes:
  opspilot_pgdata:
  opspilot_minio:
